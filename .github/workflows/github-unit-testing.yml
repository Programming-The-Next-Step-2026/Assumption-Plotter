name: GitHub Unit Testing
run-name: ${{ github.actor }} is checking her unit tests

on:
  push:
  pull_request:

jobs:
  run-unit-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2

      - name: Install dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: AssumptionPlotter
          extra-packages: any::testthat, any::devtools

      - name: Run unit tests
        run: |
          Rscript -e 'devtools::test()' | tee test_output.log

      - name: Show test output
        if: always()
        run: cat test_output.log || true


